# nginx bên trong container FE. nginx của BE (infra/nginx/nginx.prod.conf)
# proxy_pass vào đây, nên ở đây không cần TLS, không cần tên miền.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Health check để BE compose / deploy workflow kiểm tra container sống.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Asset đã có hash trong tên file nên cache vĩnh viễn được.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Capability-link document: never cache/index/embed it, never forward its
    # address as a referrer, and disable browser capabilities the page does not
    # use. The token itself stays in the URL fragment and never reaches nginx.
    location ~ ^/trip-sharing/?$ {
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "base-uri 'none'; object-src 'none'; frame-ancestors 'none'" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        try_files $uri /index.html;
    }

    # SPA dùng BrowserRouter: mọi path không phải file thật đều trả index.html,
    # nếu không thì F5 ở /manager/dashboard hay /payments/return sẽ 404.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
